name: Sync plugin directory metadata

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm
      - run: pnpm install --filter @deepseek-ai/dsh-site... --frozen-lockfile
      - run: pnpm --filter @deepseek-ai/dsh-site sync:github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm --filter @deepseek-ai/dsh-site build
      - name: Commit refreshed metadata
        run: |
          if git diff --quiet -- apps/site/registry/plugins.json; then
            exit 0
          fi
          git config user.name "deedoo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/site/registry/plugins.json
          git commit -m "chore(site): refresh plugin metadata"
          git push
