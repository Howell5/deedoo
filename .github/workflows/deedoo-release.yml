# Deedoo zero-cost update pipeline (M1).
#
# Watches the upstream npm `latest` dist-tag of @deepseek-ai/dsh (upstream
# publishes no GitHub Releases or git tags; npm is the authoritative stream).
# When that tag is strictly newer than the version packaged in this workspace,
# bumps the workspace versions, builds the unsigned desktop shell, and
# publishes a GitHub Release with the macOS artifacts and the latest.json
# manifest. macOS-first; Windows NSIS and Linux AppImage packaging is follow-up
# work. The workflow never triggers on push, so routine commits cannot cause a
# release.
#
# Deterministic decisions (no human in the loop):
# - detection source: npm dist-tag "latest"
# - comparison: semver strict greater-than (rc-aware)
# - release tag: v<target>, prerelease when the target is a prerelease
# - artifacts: unsigned DMG + ZIP (CSC_IDENTITY_AUTO_DISCOVERY=false)
name: deedoo-release

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Check upstream and report only; build and release nothing.
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: deedoo-release
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  # No paid signing at launch: build unsigned so Gatekeeper/SmartScreen
  # click-through applies, per the zero-cost distribution decision.
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      - name: Check upstream and set outputs
        id: decision
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('node:child_process')
            const run = execSync('node --import tsx/esm scripts/deedoo-update/check-upstream.ts', {
              encoding: 'utf8',
            })
            const decision = JSON.parse(run.trim())
            console.log(JSON.stringify(decision, null, 2))
            core.setOutput('updateAvailable', String(decision.updateAvailable))
            core.setOutput('target', decision.target ?? '')
            core.setOutput('current', decision.current)

      - name: No update — nothing to do
        if: steps.decision.outputs.updateAvailable != 'true'
        run: echo "current=${{ steps.decision.outputs.current }} is up to date with npm latest; no release."

      - name: Dry run — report only
        if: steps.decision.outputs.updateAvailable == 'true' && inputs.dry-run == true
        run: 'echo "dry-run: upstream ${{ steps.decision.outputs.target }} is newer than ${{ steps.decision.outputs.current }}; no build."'

      - name: Bump workspace versions to target
        if: steps.decision.outputs.updateAvailable == 'true' && inputs.dry-run != true
        run: |
          TARGET="${{ steps.decision.outputs.target }}"
          node -e "
            const fs = require('node:fs')
            for (const file of ['package.json', 'apps/desktop/package.json']) {
              const p = JSON.parse(fs.readFileSync(file, 'utf8'))
              p.version = process.argv[1]
              fs.writeFileSync(file, JSON.stringify(p, null, 2) + '\n')
            }
          " "$TARGET"

      - name: Build desktop artifacts
        if: steps.decision.outputs.updateAvailable == 'true' && inputs.dry-run != true
        run: |
          # build:desktop produces lib/web but not installers; package runs
          # stage + electron-builder and emits DMG/ZIP into apps/desktop/release.
          pnpm run build:desktop
          pnpm --filter @deepseek-ai/dsh-desktop run package

      - name: Commit version bump
        if: steps.decision.outputs.updateAvailable == 'true' && inputs.dry-run != true
        run: |
          TARGET="${{ steps.decision.outputs.target }}"
          git config user.name 'deedoo-release[bot]'
          git config user.email 'deedoo-release[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml apps/desktop/package.json
          git commit -m "chore(desktop): bump version to $TARGET from upstream detection"
          git push origin HEAD

      - name: Create GitHub Release
        if: steps.decision.outputs.updateAvailable == 'true' && inputs.dry-run != true
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET="${{ steps.decision.outputs.target }}"
          PRERELEASE=""
          if [[ "$TARGET" == *-* ]]; then PRERELEASE="--prerelease"; fi
          gh release create "v$TARGET" --title "$TARGET" --generate-notes $PRERELEASE
          # Deterministic release URL: no second API call, no consistency window.
          echo "url=https://github.com/${{ github.repository }}/releases/tag/v$TARGET" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts and latest.json
        if: steps.decision.outputs.updateAvailable == 'true' && inputs.dry-run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET="${{ steps.decision.outputs.target }}"
          node --import tsx/esm scripts/deedoo-update/write-latest-json.ts \
            --version="$TARGET" \
            --release-url="${{ steps.release.outputs.url }}" \
            --output=apps/desktop/dist/release/latest.json
          gh release upload "v$TARGET" apps/desktop/dist/release/*.dmg apps/desktop/dist/release/*.zip apps/desktop/dist/release/latest.json --clobber
