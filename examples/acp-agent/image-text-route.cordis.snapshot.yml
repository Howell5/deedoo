# Keyless replay for the text-route vision-sidecar scenario. The replay catalog
# keeps DeepSeek text-only and adds the configured GLM route as image-capable;
# the override script supplies the auxiliary GLM description before the two
# DeepSeek calls, so the durable tool result carries a persisted description.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: acp-agent
        name: '@deepseek-ai/dsh-acp-demo'
        config:
          provider: deepseek-official
          model: deepseek-v4-flash
          persistenceRoot: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: none
          workspaceContext:
            maxBytes: 65536
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - insert:
          - id: attachment-local
            name: '@deepseek-ai/dsh-attachment-local'
          - id: llm-vision-sidecar
            name: '@deepseek-ai/dsh-llm-vision-sidecar'
            config:
              enabled: true
              provider: glm-vision
              model: glm-4v-flash
              timeoutMs: 60000
              maxOutputTokens: 1024
              maxDescriptionChars: 4000
              maxImagesPerStep: 8
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
            config:
              providers:
                - id: deepseek-official
                  name: DeepSeek
                  models:
                    - id: deepseek-v4-flash
                      inputModalities: [text]
                    - id: deepseek-v4-pro
                      inputModalities: [text]
                - id: glm-vision
                  name: GLM Vision
                  models:
                    - id: glm-4v-flash
                      inputModalities: [text, image]
