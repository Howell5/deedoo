# Text-route image overlay: the attachment store registers read_image, while
# the configured vision sidecar describes the resulting image before the
# text-only DeepSeek route continues. The app config is restated to re-pin
# `deepseek-v4-flash` (base ships pro; the authored fixture and the pinned
# header class are flash), because a config patch replaces the whole app config.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: acp-agent
        name: '@deepseek-ai/dsh-acp-demo'
        config:
          provider: deepseek-official
          model: deepseek-v4-flash
          persistenceRoot: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: none
          workspaceContext:
            maxBytes: 65536
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - insert:
          - id: attachment-local
            name: '@deepseek-ai/dsh-attachment-local'
          - id: llm-vision-sidecar
            name: '@deepseek-ai/dsh-llm-vision-sidecar'
            config:
              enabled: true
              provider: glm-vision
              model: glm-4v-flash
              timeoutMs: 60000
              maxOutputTokens: 1024
              maxDescriptionChars: 4000
              maxImagesPerStep: 8
