<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self';"
    />
    <title>正在启动 DeepSeek Harness</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        background: #f7f8fa;
        color: #17191d;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        background: #f7f8fa;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }

      main {
        display: flex;
        width: min(440px, calc(100vw - 48px));
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .mark {
        width: 58px;
        height: 58px;
        border-radius: 17px;
        box-shadow: 0 8px 24px rgb(20 32 56 / 8%);
      }

      .mark img {
        display: block;
        width: 100%;
        height: 100%;
      }

      h1 {
        margin: 22px 0 0;
        font-size: 22px;
        font-weight: 620;
        letter-spacing: -0.02em;
      }

      p {
        margin: 9px 0 0;
        color: #6c727f;
        font-size: 14px;
        line-height: 1.65;
      }

      .progress {
        position: relative;
        width: 156px;
        height: 3px;
        margin-top: 28px;
        overflow: hidden;
        border-radius: 99px;
        background: #e5e8ed;
      }

      .progress::after {
        position: absolute;
        inset: 0 auto 0 0;
        width: 44%;
        border-radius: inherit;
        background: #2f67e8;
        content: "";
        animation: loading 1.25s ease-in-out infinite;
      }

      .hint {
        margin-top: 18px;
        color: #9a9faa;
        font-size: 12px;
      }

      @keyframes loading {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(340%);
        }
      }

      @media (prefers-color-scheme: dark) {
        :root,
        body {
          background: #17191d;
          color: #f2f3f5;
        }

        .mark {
          box-shadow: 0 8px 24px rgb(0 0 0 / 24%);
        }

        p {
          color: #a3a8b2;
        }

        .progress {
          background: #30343b;
        }

        .progress::after {
          background: #7fa3ff;
        }

        .hint {
          color: #747a85;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .progress::after {
          width: 58%;
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"><img src="./icon.png" alt="" /></div>
      <h1>正在准备 DeepSeek Harness</h1>
      <p>首次启动可能需要几秒钟。应用正在初始化本地工作区、插件和安全边界。</p>
      <div class="progress" role="progressbar" aria-label="正在启动"></div>
      <div class="hint">无需安装 Node.js</div>
    </main>
  </body>
</html>
